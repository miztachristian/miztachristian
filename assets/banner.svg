<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="Christian Onyekwe, Senior Data Engineer">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="0.5" stop-color="#fcd34d"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.82"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.20"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#161f33" stroke-width="1"/></pattern>
    <clipPath id="wc"><text x="76" y="132" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2">Christian Onyekwe</text></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="sm"><rect width="1200" height="300" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1200" height="300" fill="#070a11"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="140" cy="10" rx="470" ry="280" fill="url(#gA)"/>
  <ellipse cx="1040" cy="290" rx="500" ry="290" fill="url(#gB)"/>

  <g mask="url(#sm)">
    <rect x="0" y="0" width="1200" height="2" fill="#f59e0b">
      <animate attributeName="y" values="18;282;18" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.42;0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="76" y="132" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="url(#brand)">Christian Onyekwe</text>
  <g clip-path="url(#wc)">
    <rect x="-300" y="62" width="175" height="120" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;800" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="79" y="170" font-family="JetBrains Mono,Courier New,monospace" font-size="16" letter-spacing="3.4" fill="#94a3b8">SENIOR DATA ENGINEER  ·  CLOUD DATA PLATFORMS  ·  FINOPS</text>

  <g font-family="JetBrains Mono,Courier New,monospace" font-size="12.5" font-weight="600">
    <g transform="translate(79,194)"><rect width="70" height="27" rx="13.5" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.36"/><text x="35" y="18" text-anchor="middle" fill="#fcd34d">AZURE</text></g>
    <g transform="translate(159,194)"><rect width="94" height="27" rx="13.5" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.36"/><text x="47" y="18" text-anchor="middle" fill="#fcd34d">DATABRICKS</text></g>
    <g transform="translate(263,194)"><rect width="86" height="27" rx="13.5" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.36"/><text x="43" y="18" text-anchor="middle" fill="#a78bfa">TERRAFORM</text></g>
    <g transform="translate(359,194)"><rect width="72" height="27" rx="13.5" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.36"/><text x="36" y="18" text-anchor="middle" fill="#a78bfa">FINOPS</text></g>
  </g>

  <!-- medallion pipeline: bronze -> silver -> gold, with data flowing through -->
  <g>
    <line x1="798" y1="126" x2="912" y2="126" stroke="#334155" stroke-width="2"/>
    <line x1="978" y1="126" x2="1092" y2="126" stroke="#334155" stroke-width="2"/>

    <g fill="#cd7f32">
      <circle cx="798" cy="126" r="4"><animate attributeName="cx" values="798;912" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="798" cy="126" r="4"><animate attributeName="cx" values="798;912" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/></circle>
      <circle cx="798" cy="126" r="4"><animate attributeName="cx" values="798;912" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#e2e8f0">
      <circle cx="978" cy="126" r="4"><animate attributeName="cx" values="978;1092" dur="2.4s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="-0.4s" repeatCount="indefinite"/></circle>
      <circle cx="978" cy="126" r="4"><animate attributeName="cx" values="978;1092" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="978" cy="126" r="4"><animate attributeName="cx" values="978;1092" dur="2.4s" begin="-2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="-2.0s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="JetBrains Mono,Courier New,monospace" font-size="11" font-weight="700" text-anchor="middle">
      <g transform="translate(765,126)">
        <circle r="33" fill="#0d1422" stroke="#cd7f32" stroke-width="2"/>
        <text y="4" fill="#cd7f32">BRONZE</text>
        <circle r="33" fill="none" stroke="#cd7f32" stroke-width="1.5"><animate attributeName="r" values="33;42" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/></circle>
      </g>
      <g transform="translate(945,126)">
        <circle r="33" fill="#0d1422" stroke="#cbd5e1" stroke-width="2"/>
        <text y="4" fill="#cbd5e1">SILVER</text>
        <circle r="33" fill="none" stroke="#cbd5e1" stroke-width="1.5"><animate attributeName="r" values="33;42" dur="3s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
      </g>
      <g transform="translate(1125,126)">
        <circle r="33" fill="#0d1422" stroke="#fcd34d" stroke-width="2"/>
        <text y="4" fill="#fcd34d">GOLD</text>
        <circle r="33" fill="none" stroke="#fcd34d" stroke-width="1.5"><animate attributeName="r" values="33;42" dur="3s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="3s" begin="-2s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>

  <g transform="translate(768,208)" font-family="JetBrains Mono,Courier New,monospace">
    <circle r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.35;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="none" stroke="#34d399" stroke-width="1.5"><animate attributeName="r" values="5;16" dur="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="1.9s" repeatCount="indefinite"/></circle>
    <text x="16" y="4" font-size="12.5" letter-spacing="1.4" fill="#34d399">MEDALLION ARCHITECTURE  ·  GOVERNED  ·  OBSERVABLE</text>
  </g>
</svg>
